<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gerrit Review Analytics</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; }
        .review-card { background: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; max-width: 1000px; margin: auto; margin-bottom: 20px; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .lgtm-badge { background: #065f46; color: #34d399; }
        .detail-badge { background: #1e3a8a; color: #93c5fd; }
        .subject { font-size: 1.25rem; font-weight: bold; color: #f8fafc; }
        .meta { font-size: 0.85rem; color: #94a3b8; margin-top: 5px; }
        pre { background: #000; padding: 15px; border-radius: 6px; overflow-x: auto; color: #e2e8f0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
        a { color: #3b82f6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <a href="../../../index.html" class="back-link">← Back to Portal</a>
            <div id="build-status-mini" style="background:#1e293b; padding:8px 15px; border-radius:8px; border:1px solid #334155; font-size:0.75rem;">
                <span style="color:#94a3b8;">Latest Build:</span> <span id="build-progress-text" style="color:#fbbf24;">Loading...</span>
            </div>
        </div>
        <h1 style="text-align:center; color:#3b82f6;" id="page-title">Gerrit Review Summary</h1>
        <div id="reviews-container"></div>
    </div>

    <script>
        async function updateBuildStatus() {
            try {
                // Try fetching from public/internal build data
                const response = await fetch('../../auto_build/builds.json');
                if (!response.ok) return;
                const data = await response.json();
                const latest = Object.values(data).flat().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
                const textEl = document.getElementById('build-progress-text');
                if (latest) {
                    textEl.innerText = `${latest.model} (${latest.timestamp})`;
                    textEl.style.color = "#34d399";
                }
            } catch (err) { }
        }

        async function loadReviews() {
            try {
                const response = await fetch('reviews.json');
                const data = await response.json();
                const container = document.getElementById('reviews-container');
                container.innerHTML = '';

                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

                Object.values(data).sort((a, b) => b.timestamp - a.timestamp).forEach(review => {
                    const card = document.createElement('div');
                    card.className = 'review-card';
                    
                    const isLgtm = review.verdict === 'LGTM';
                    const badgeClass = isLgtm ? 'lgtm-badge' : 'detail-badge';
                    const badgeText = isLgtm ? 'LGTM' : 'DETAILED FEEDBACK';

                    const subjectHtml = isLocal 
                        ? `<a href="${review.url}" target="_blank">${review.subject}</a>`
                        : review.subject;

                    let opinionHtml = `<div style='margin-top:10px; padding:15px; background:rgba(255,255,255,0.05); border-radius:4px;'><pre>${review.opinion}</pre></div>`;

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <div class="subject">${subjectHtml}</div>
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="meta">Project: ${review.project} | Owner: ${review.owner}</div>
                        ${opinionHtml}
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Reviews Error:', err);
            }
        }
        
        updateBuildStatus();
        loadReviews();
        setInterval(updateBuildStatus, 60000);
    </script>
</body>
</html>
