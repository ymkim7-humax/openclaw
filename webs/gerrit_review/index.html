<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gerrit Review Analytics</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; }
        .review-card { background: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; max-width: 1000px; margin: auto; margin-bottom: 20px; }
        .lgtm-section { background: rgba(52, 211, 153, 0.1); border-left: 4px solid #34d399; padding: 15px; border-radius: 4px; margin-top: 10px; }
        .detail-section { background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6; padding: 15px; border-radius: 4px; margin-top: 10px; }
        .lgtm-badge { background: #065f46; color: #34d399; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .detail-badge { background: #1e3a8a; color: #93c5fd; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .subject { font-size: 1.25rem; font-weight: bold; color: #f8fafc; }
        .meta { font-size: 0.85rem; color: #94a3b8; margin-top: 5px; }
        summary { cursor: pointer; color: #3b82f6; font-weight: bold; margin-top: 10px; }
        summary:hover { text-decoration: underline; }
        pre { background: #000; padding: 15px; border-radius: 6px; overflow-x: auto; color: #e2e8f0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
        a { color: #3b82f6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: auto;">
        <a href="../../../" class="back-link">← Back to Portal</a>
        <h1 style="text-align:center; color:#3b82f6;">🔍 Gerrit Review Summary</h1>
        <div id="reviews-container"></div>
    </div>

    <script>
        const INTERNAL_IP = "10.250.4.166";

        async function loadReviews() {
            try {
                const response = await fetch('reviews.json');
                const data = await response.json();
                const container = document.getElementById('reviews-container');
                container.innerHTML = '';

                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === INTERNAL_IP;

                Object.values(data).sort((a, b) => b.timestamp - a.timestamp).forEach(review => {
                    const card = document.createElement('div');
                    card.className = 'review-card';
                    
                    const isLgtm = review.verdict === 'LGTM';
                    const badgeClass = isLgtm ? 'lgtm-badge' : 'detail-badge';
                    const sectionClass = isLgtm ? 'lgtm-section' : 'detail-section';
                    const badgeText = isLgtm ? 'LGTM' : 'DETAILED FEEDBACK';

                    // Environment-aware link
                    const subjectHtml = isLocal 
                        ? `<a href="${review.url}" target="_blank">${review.subject}</a>`
                        : review.subject;

                    let opinionHtml = '';
                    if (isLgtm) {
                        opinionHtml = `<div class="${sectionClass}">LGTM</div>`;
                    } else {
                        opinionHtml = `
                            <div class="${sectionClass}">
                                <details>
                                    <summary>View AI Analysis & Suggestions</summary>
                                    <pre>${review.opinion}</pre>
                                </details>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <div class="subject">${subjectHtml}</div>
                            <span class="${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="meta">
                            Project: <b>${review.project}</b> | Owner: <b>${review.owner}</b> | Patch Set: ${review.ps_num}
                        </div>
                        ${opinionHtml}
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Reviews Error:', err);
            }
        }
        loadReviews();
    </script>
</body>
</html>
