<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OC Management Portal</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { max-width: 600px; width: 100%; text-align: center; }
        h1 { color: #3b82f6; font-size: 2.5rem; margin-bottom: 30px; }
        .portal-grid { display: grid; gap: 20px; }
        .job-link { 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            padding: 25px; 
            text-decoration: none; 
            color: inherit; 
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .job-link:hover { 
            border-color: #3b82f6; 
            background: #243352; 
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .icon { font-size: 2rem; margin-bottom: 10px; }
        .name { font-weight: bold; font-size: 1.25rem; color: #34d399; }
        .desc { color: #94a3b8; font-size: 0.9rem; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 OC Portal</h1>
        <div class="portal-grid">
            <a href="auto_build/index.html" class="job-link">
                <div class="icon">📊</div>
                <div class="name">Build Analytics</div>
                <div class="desc">HP2236B & HP2272B Automated Build History</div>
            </a>
            <a href="gerrit_review/index.html" class="job-link">
                <div class="icon">🔍</div>
                <div class="name">Gerrit Review</div>
                <div class="desc">AI-powered Gerrit Code Review Summary</div>
            </a>
        </div>
    </div>
</body>
</html>
