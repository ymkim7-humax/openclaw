<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Build Dashboard v6 - Enhanced</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; max-width: 1000px; margin: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; color: #94a3b8; font-size: 12px; border-bottom: 2px solid #334155; }
        td { padding: 10px; font-size: 13px; }
        code { background: #000; padding: 2px 5px; border-radius: 3px; color: #34d399; font-size: 11px; }
        .success { color: #34d399; font-weight: bold; font-size: 14px; }
        .label { color: #64748b; font-size: 11px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top:0; color:#3b82f6;">📊 Build Analytics Report</h2>
        <table id="buildTable">
            <thead>
                <tr>
                    <th>시작 일시 (KST)</th>
                    <th>결과</th>
                    <th>Git Hashes</th>
                    <th>Binary Sizes (Bytes)</th>
                    <th>RootFS Stats</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function loadBuilds() {
            try {
                const response = await fetch('builds.json');
                const data = await response.json();
                const tbody = document.querySelector('#buildTable tbody');
                tbody.innerHTML = '';

                data.forEach(build => {
                    const row1 = document.createElement('tr');
                    row1.style.background = 'rgba(255,255,255,0.02)';
                    
                    const formattedSize = build.bin_size.toLocaleString();
                    
                    row1.innerHTML = `
                        <td rowspan="2" style="border-left: 4px solid #34d399; font-size: 12px; color: #94a3b8;">${build.timestamp}</td>
                        <td class="success">SUCCESS</td>
                        <td><span class="label">Airoha:</span> <code>${build.git_hash}</code></td>
                        <td><span class="label">Linux:</span> ${formattedSize} B</td>
                        <td><span class="label">RootFS:</span> ${build.rootfs_files} files</td>
                    `;
                    const row2 = document.createElement('tr');
                    row2.style.borderBottom = '2px solid #334155';
                    
                    let downloadLink = `<span style="color: #64748b; font-size: 11px; font-style: italic;">(Expired)</span>`;
                    // Note: In GitHub Pages/Vercel, the release folder won't be available unless pushed.
                    // Assuming for now we only push the dashboard metadata.
                    
                    row2.innerHTML = `
                        <td><span class="label">Model:</span> <b style="color: #fbbf24;">${build.model}</b></td>
                        <td><span class="label">File:</span> <code>${build.filename}</code></td>
                        <td><span class="label">Changes:</span> <b style="color: #60a5fa;">${build.changes}</b></td>
                        <td></td>
                    `;
                    tbody.appendChild(row1);
                    tbody.appendChild(row2);
                });
            } catch (err) {
                console.error('AutoBuild UI Error:', err);
            }
        }
        loadBuilds();
    </script>
</body>
</html>
