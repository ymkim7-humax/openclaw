<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Build Analytics Dashboard</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; }
        .model-section { margin-bottom: 40px; }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; max-width: 1100px; margin: auto; }
        h2 { color: #3b82f6; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 12px 10px; color: #94a3b8; font-size: 12px; border-bottom: 2px solid #334155; text-transform: uppercase; }
        td { padding: 12px 10px; font-size: 13px; border-bottom: 1px solid #1e293b; }
        tr:hover { background: rgba(255,255,255,0.02); }
        code { background: #000; padding: 2px 5px; border-radius: 3px; color: #34d399; font-size: 11px; }
        .success { color: #34d399; font-weight: bold; }
        .label { color: #64748b; font-size: 11px; margin-right: 5px; }
        .changes { color: #60a5fa; font-weight: bold; }
        .download-link { color: #34d399; text-decoration: none; border-bottom: 1px dashed #34d399; }
        .download-link:hover { color: #00e676; border-bottom-style: solid; }
        .internal-note { color: #64748b; font-size: 10px; font-style: italic; display: block; margin-top: 2px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3b82f6; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="dashboard-content">
        <a href="../../../" class="back-link">← Back to Portal</a>
        <h1 style="text-align:center; color:#3b82f6;">📊 Build Analytics Dashboard</h1>
        <div id="models-container"></div>
    </div>

    <script>
        const INTERNAL_IP = "10.250.4.166";
        
        async function loadDashboard() {
            try {
                // Fetch data from local json in same directory
                const response = await fetch('builds.json');
                const data = await response.json();
                const container = document.getElementById('models-container');
                container.innerHTML = '';

                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === INTERNAL_IP;

                Object.keys(data).sort().forEach(model => {
                    const section = document.createElement('div');
                    section.className = 'model-section';
                    
                    let rowsHtml = '';
                    data[model].forEach(build => {
                        // Link back to the release folder
                        // Adjusting paths:
                        // Local: webs/local/jobs/auto_build/webs/index.html -> webs/local/jobs/auto_build/release/
                        // GitHub: webs/auto_build/index.html -> points back to Internal IP
                        const baseUrl = isLocal ? '../release/' : `http://${INTERNAL_IP}/jobs/auto_build/release/`;
                        
                        const linuxLink = `<a href="${baseUrl}${build.linux_file}" class="download-link">${build.linux_file}</a>`;
                        const bootLink = build.boot_file ? `<a href="${baseUrl}${build.boot_file}" class="download-link">${build.boot_file}</a>` : 'N/A';
                        const envNote = isLocal ? '' : '<span class="internal-note">(Humax Network Required)</span>';

                        rowsHtml += `
                            <tr>
                                <td style="color: #94a3b8; white-space: nowrap;">${build.timestamp}</td>
                                <td class="success">SUCCESS</td>
                                <td><code>${build.git_hash}</code></td>
                                <td>
                                    <div style="margin-bottom:4px;"><span class="label">OS:</span>${build.linux_size.toLocaleString()} B</div>
                                    <div><span class="label">BOOT:</span>${build.boot_size.toLocaleString()} B</div>
                                </td>
                                <td>${build.rootfs_files} files</td>
                                <td class="changes">${build.changes}</td>
                                <td>
                                    <div style="margin-bottom:8px;">${linuxLink}</div>
                                    <div>${bootLink}</div>
                                    ${envNote}
                                </td>
                            </tr>
                        `;
                    });

                    section.innerHTML = `
                        <div class="card">
                            <h2>Project: ${model}</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Date (KST)</th>
                                        <th>Status</th>
                                        <th>Git Hash</th>
                                        <th>Sizes</th>
                                        <th>RootFS</th>
                                        <th>Changes</th>
                                        <th>Download Artifacts</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(section);
                });
            } catch (err) {
                console.error('Dashboard Error:', err);
            }
        }
        loadDashboard();
    </script>
</body>
</html>
